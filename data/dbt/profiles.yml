# DuckDB is the engine; bronze Parquet is read straight from the S3-compatible lake.
hivebets:
  target: "{{ env_var('DBT_TARGET', 'lake') }}"
  outputs:
    lake:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/tmp/hivebets-lake.duckdb') }}"
      threads: 4
      extensions: [httpfs]
      settings:
        TimeZone: UTC
      secrets:
        - type: s3
          key_id: "{{ env_var('S3_ACCESS_KEY', 'hivebets') }}"
          secret: "{{ env_var('S3_SECRET_KEY', 'hivebets-secret') }}"
          endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:9000') }}"
          region: us-east-1
          url_style: path
          use_ssl: false
    # Reads a local copy of bronze (BRONZE_URI=/path/to/bronze, filled by `python -m pipeline.sync_bronze`).
    # For machines that cannot download DuckDB's httpfs extension.
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/tmp/hivebets-lake.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC
