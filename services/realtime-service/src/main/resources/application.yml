server:
  port: ${SERVER_PORT:8104}
spring:
  application.name: realtime-service
  data.redis:
    host: ${REDIS_HOST:localhost}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:hivebets}
    password: ${RABBIT_PASSWORD:hivebets}
    listener.simple:
      prefetch: 200
      default-requeue-rejected: false
      # Failed handling is retried in place with exponential backoff, then rejected without
      # requeue, which sends it to realtime.events.dlq (scripts/replay_dlq.py moves it back).
      retry:
        enabled: true
        max-attempts: 4
        initial-interval: 500ms
        multiplier: 2
        max-interval: 5s
logging.structured.format.console: ecs
management.endpoints.web.exposure.include: health,info
hivebets:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
