server:
  port: ${SERVER_PORT:8106}
spring:
  application:
    name: analytics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hivebets}
    username: ${DB_USER:hivebets}
    password: ${DB_PASSWORD:hivebets}
    hikari:
      maximum-pool-size: 5
      read-only: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: ecs
